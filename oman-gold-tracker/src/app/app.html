<div
  class="min-h-screen bg-gray-50 text-gray-900
         transition-colors duration-300
         dark:bg-gray-950 dark:text-gray-100"
>

  <app-header></app-header>

  <main>

    <!-- Hero -->
    <app-hero></app-hero>

    <!-- Today's Gold Prices -->
    <section
      id="prices"
      class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8"
    >

      <div class="mb-8">

        <h2 class="text-3xl font-bold text-gray-900 dark:text-white">
          {{ language.t('todayPricesTitle') }}
        </h2>

        <p class="mt-2 text-gray-600 dark:text-gray-400">
          {{ language.t('todayPricesDescription') }}
        </p>

      </div>

      
      @if (loading) {
        <p>Loading gold prices...</p>
      } @else if (errorMessage) {
        <p>{{ errorMessage }}</p>
      } @else {
        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
          @for (item of goldPrices; track item.karat) {
            <app-price-card
              [karat]="item.karat"
              [price]="item.price">
            </app-price-card>
          }
        </div>
      }


    </section>

    <!-- Gold Calculator -->
    <section
      id="calculator"
      class="bg-white py-16 transition-colors duration-300 dark:bg-gray-900"
    >

      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

        <app-gold-calculator>
        </app-gold-calculator>

      </div>

    </section>

    <!-- 30-Day Price Trend -->
    <section
      id="trend"
      class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8"
    >

      <app-price-trend>
      </app-price-trend>

    </section>

    <!-- Price History -->
    <section
      id="history"
      class="bg-white py-16 transition-colors duration-300 dark:bg-gray-900"
    >

      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

        <app-price-history>
        </app-price-history>

      </div>

    </section>

  </main>

  <app-footer></app-footer>

</div>
