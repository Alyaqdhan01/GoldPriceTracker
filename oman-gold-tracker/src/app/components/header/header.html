<header
  class="sticky top-0 z-50 border-b border-gray-200 bg-white/95 shadow-sm backdrop-blur
         transition-colors duration-300
         dark:border-gray-700 dark:bg-gray-900/95"
>

  <div
    class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8"
  >

    <!-- Logo -->
    <a href="#" class="flex items-center gap-3">

      <div
        class="flex h-10 w-10 items-center justify-center rounded-full
               bg-amber-500 text-lg font-bold text-white"
      >
        ذ
      </div>

      <div>

        <h1 class="text-lg font-bold text-gray-900 dark:text-white">
          {{ language.t('siteName') }}
        </h1>


        <p class="text-xs text-gray-500 dark:text-gray-400">
          {{ language.t('siteSubtitle') }}
        </p>

      </div>

    </a>


    <!-- Navigation -->
    <nav class="hidden items-center gap-6 md:flex">

      <a
        href="#prices"
        class="text-sm font-medium text-gray-600 transition
              hover:text-amber-600
              dark:text-gray-300 dark:hover:text-amber-400"
      >
        {{ language.t('navPrices') }}
      </a>

      <a
        href="#calculator"
        class="text-sm font-medium text-gray-600 transition
               hover:text-amber-600
               dark:text-gray-300 dark:hover:text-amber-400"
      >
        {{ language.t('navCalculator') }}
      </a>

      <a
        href="#trend"
        class="text-sm font-medium text-gray-600 transition
               hover:text-amber-600
               dark:text-gray-300 dark:hover:text-amber-400"
      >
        {{ language.t('navTrend') }}
        
      </a>

      <a
        href="#history"
        class="text-sm font-medium text-gray-600 transition
               hover:text-amber-600
               dark:text-gray-300 dark:hover:text-amber-400"
      >
        {{ language.t('navHistory') }}
      </a>

    </nav>


    <!-- Right controls -->
    <div class="flex items-center gap-2">

      <!-- Demo badge -->
      <span
        class="hidden rounded-full bg-amber-50 px-3 py-1 text-xs
               font-semibold text-amber-700
               sm:inline-block
               dark:bg-amber-900/30 dark:text-amber-300"
      >
        {{ language.t('demoData') }}
      </span>

      <button
        type="button"
        (click)="toggleLanguage()"
        class="flex h-10 min-w-10 items-center justify-center
              rounded-full border border-gray-200 bg-gray-100
              px-3 text-sm font-bold text-gray-700
              transition hover:bg-gray-200
              dark:border-gray-700 dark:bg-gray-800
              dark:text-white dark:hover:bg-gray-700"
        >
          @if (language.isArabic()) {
            EN
        } @else {
            AR
        }
      </button>


      <!-- Dark mode button -->
      <button
        type="button"
        (click)="toggleDarkMode()"
        class="flex h-10 w-10 items-center justify-center rounded-full
               border border-gray-200 bg-gray-100 text-lg
               transition hover:bg-gray-200
               dark:border-gray-700 dark:bg-gray-800
               dark:hover:bg-gray-700"
        aria-label="تغيير المظهر"
      >

        @if (isDarkMode) {
          ☀️
        } @else {
          🌙
        }

      </button>

    </div>

  </div>

</header>
